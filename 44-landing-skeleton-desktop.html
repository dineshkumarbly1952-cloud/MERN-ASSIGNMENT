<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>44 - Desktop Landing Page Skeleton Structure</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #151c2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --border: #243049;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }

        /* --- SKELETON WIREFRAME GLOBAL STYLES --- */
        .skeleton-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
            border-bottom: 1px solid var(--border);
        }

        .skeleton-nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Hero Skeleton Grid */
        .skeleton-hero {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 50px;
            align-items: center;
            padding: 80px 0;
            border-bottom: 1px solid var(--border);
        }

        .skeleton-block {
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        .text-line {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        /* Features Section Skeleton Grid */
        .skeleton-features {
            padding: 80px 0;
        }

        .features-grid-skeleton {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }

        .feature-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Footer Skeleton */
        .skeleton-footer {
            border-top: 1px solid var(--border);
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Desktop Header Skeleton -->
    <header class="skeleton-header container">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 32px; height: 32px; background: var(--primary); border-radius: 8px;"></div>
            <div style="font-weight: 800; font-size: 1.2rem;">Desktop Skeleton UI</div>
        </div>
        <ul class="skeleton-nav-links">
            <li>Overview</li>
            <li>Wireframe</li>
            <li>Layout Structure</li>
            <li>Documentation</li>
        </ul>
        <div style="width: 110px; height: 36px; background: rgba(99,102,241,0.2); border: 1px solid var(--primary); border-radius: 8px;"></div>
    </header>

    <!-- Main Content Container -->
    <main class="container">

        <!-- Hero Skeleton Section -->
        <section class="skeleton-hero">
            <div>
                <div class="text-line" style="width: 140px; height: 28px; border-radius: 20px; margin-bottom: 24px; background: rgba(99,102,241,0.15);"></div>
                <div class="text-line" style="width: 100%; height: 50px;"></div>
                <div class="text-line" style="width: 75%; height: 50px; margin-bottom: 24px;"></div>
                <div class="text-line" style="width: 90%; height: 18px;"></div>
                <div class="text-line" style="width: 60%; height: 18px; margin-bottom: 30px;"></div>
                <div style="display: flex; gap: 16px;">
                    <div style="width: 140px; height: 44px; background: var(--primary); border-radius: 8px;"></div>
                    <div style="width: 140px; height: 44px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;"></div>
                </div>
            </div>

            <div class="skeleton-block" style="height: 360px; display: flex; align-items: center; justify-content: center;">
                <div style="font-size: 3rem; color: var(--text-muted);">🖥️</div>
            </div>
        </section>

        <!-- Features Grid Skeleton Section -->
        <section class="skeleton-features">
            <div style="text-align: center; max-width: 600px; margin: 0 auto;">
                <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 10px;">Desktop Wireframe Layout</h2>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Structural skeleton framework illustrating macro layout tracks and container boundaries.</p>
            </div>

            <div class="features-grid-skeleton">
                <div class="feature-box">
                    <div style="width: 40px; height: 40px; background: rgba(99,102,241,0.2); border-radius: 8px;"></div>
                    <div>
                        <div class="text-line" style="width: 70%; height: 20px;"></div>
                        <div class="text-line" style="width: 90%; height: 14px;"></div>
                    </div>
                </div>

                <div class="feature-box">
                    <div style="width: 40px; height: 40px; background: rgba(99,102,241,0.2); border-radius: 8px;"></div>
                    <div>
                        <div class="text-line" style="width: 70%; height: 20px;"></div>
                        <div class="text-line" style="width: 90%; height: 14px;"></div>
                    </div>
                </div>

                <div class="feature-box">
                    <div style="width: 40px; height: 40px; background: rgba(99,102,241,0.2); border-radius: 8px;"></div>
                    <div>
                        <div class="text-line" style="width: 70%; height: 20px;"></div>
                        <div class="text-line" style="width: 90%; height: 14px;"></div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer Skeleton -->
    <footer class="skeleton-footer">
        <p>&copy; 2026 Rishabh Goswami. Assignment 44 - Desktop Landing Page Skeleton Structure.</p>
    </footer>

</body>
</html>
