<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --accent-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #cbd5e1;
      --input-bg: #ffffff;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2.5rem 1rem;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    p.description {
      color: #64748b;
      font-size: 0.95rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    fieldset {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      background-color: #ffffff;
    }

    legend {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
      padding: 0 0.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }

    .required {
      color: #dc2626;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--input-bg);
      font-size: 0.95rem;
      color: var(--text-color);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 0.3rem;
    }

    .option-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 400;
      cursor: pointer;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"] {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-color);
    }

    button[type="reset"] {
      background-color: transparent;
      color: #64748b;
      border: 1px solid var(--border-color);
    }

    button[type="reset"]:hover {
      background-color: #f1f5f9;
      color: var(--text-color);
    }

    @media (max-width: 640px) {
      .form-container {
        padding: 1.5rem;
      }
      .form-actions {
        flex-direction: column-reverse;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <header>
      <h1>Academic Registration</h1>
      <p class="description">Please complete the form below to enroll in the academic program.</p>
    </header>

    <form action="#" method="post">
      
      <!-- Personal Details -->
      <fieldset>
        <legend>Personal Information</legend>
        <div class="form-grid">
          
          <div class="form-group">
            <label for="first-name">First Name <span class="required">*</span></label>
            <input type="text" id="first-name" name="firstName" required placeholder="e.g., Alex">
          </div>

          <div class="form-group">
            <label for="last-name">Last Name <span class="required">*</span></label>
            <input type="text" id="last-name" name="lastName" required placeholder="e.g., Morgan">
          </div>

          <div class="form-group">
            <label for="dob">Date of Birth <span class="required">*</span></label>
            <input type="date" id="dob" name="dob" required>
          </div>

          <div class="form-group">
            <label>Gender <span class="required">*</span></label>
            <div class="radio-group">
              <label class="option-label">
                <input type="radio" name="gender" value="female" required> Female
              </label>
              <label class="option-label">
                <input type="radio" name="gender" value="male"> Male
              </label>
              <label class="option-label">
                <input type="radio" name="gender" value="other"> Other
              </label>
            </div>
          </div>

        </div>
      </fieldset>

      <!-- Contact Details -->
      <fieldset>
        <legend>Contact Information</legend>
        <div class="form-grid">

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="alex.morgan@example.com">
          </div>

          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 019-2834">
          </div>

          <div class="form-group full-width">
            <label for="address">Residential Address <span class="required">*</span></label>
            <input type="text" id="address" name="address" required placeholder="Street Address, City, State, ZIP">
          </div>

        </div>
      </fieldset>

      <!-- Academic Details -->
      <fieldset>
        <legend>Academic Preferences</legend>
        <div class="form-grid">

          <div class="form-group">
            <label for="program">Program / Major <span class="required">*</span></label>
            <select id="program" name="program" required>
              <option value="" disabled selected>Select a program...</option>
              <option value="btech-env">B.Tech Environmental Engineering</option>
              <option value="bs-cs">B.S. Computer Science</option>
              <option value="bs-ee">B.S. Electrical Engineering</option>
              <option value="ba-design">B.A. Graphic Design</option>
            </select>
          </div>

          <div class="form-group">
            <label for="entry-term">Preferred Entry Term <span class="required">*</span></label>
            <select id="entry-term" name="entryTerm" required>
              <option value="" disabled selected>Select term...</option>
              <option value="fall-2027">Fall 2027</option>
              <option value="spring-2028">Spring 2028</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label>Areas of Interest</label>
            <div class="checkbox-group">
              <label class="option-label">
                <input type="checkbox" name="interests" value="water-treatment"> Water Treatment
              </label>
              <label class="option-label">
                <input type="checkbox" name="interests" value="renewable-energy"> Renewable Energy
              </label>
              <label class="option-label">
                <input type="checkbox" name="interests" value="software-dev"> Software Development
              </label>
              <label class="option-label">
                <input type="checkbox" name="interests" value="ui-ux"> UI/UX Design
              </label>
            </div>
          </div>

          <div class="form-group full-width">
            <label for="notes">Additional Comments or Special Accommodations</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Enter any extra details or inquiries here..."></textarea>
          </div>

        </div>
      </fieldset>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="reset">Reset Form</button>
        <button type="submit">Submit Registration</button>
      </div>

    </form>
  </div>

</body>
</html>
