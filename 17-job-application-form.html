<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #334155;
      --border-color: #cbd5e1;
      --input-bg: #ffffff;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 2.5rem 1rem;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    p.description {
      color: #64748b;
      font-size: 0.95rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    fieldset {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      background-color: #ffffff;
    }

    legend {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
      padding: 0 0.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }

    .required {
      color: #dc2626;
      margin-left: 2px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    input[type="date"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--input-bg);
      font-size: 0.95rem;
      color: var(--text-color);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="file"] {
      padding: 0.5rem;
      background: #f8fafc;
      cursor: pointer;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="url"]:focus,
    input[type="date"]:focus,
    input[type="number"]:focus,
    input[type="file"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-top: 0.3rem;
    }

    .option-label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 400;
      cursor: pointer;
    }

    input[type="radio"],
    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"] {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-color);
    }

    button[type="reset"] {
      background-color: transparent;
      color: #64748b;
      border: 1px solid var(--border-color);
    }

    button[type="reset"]:hover {
      background-color: #f1f5f9;
      color: var(--text-color);
    }

    @media (max-width: 640px) {
      .form-container {
        padding: 1.5rem;
      }
      .form-actions {
        flex-direction: column-reverse;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <header>
      <h1>Employment Application</h1>
      <p class="description">Submit your details to apply for open positions within our organization.</p>
    </header>

    <form action="#" method="post" enctype="multipart/form-data">
      
      <!-- Personal Details -->
      <fieldset>
        <legend>Applicant Information</legend>
        <div class="form-grid">
          
          <div class="form-group">
            <label for="first-name">First Name <span class="required">*</span></label>
            <input type="text" id="first-name" name="firstName" required placeholder="e.g., Alex">
          </div>

          <div class="form-group">
            <label for="last-name">Last Name <span class="required">*</span></label>
            <input type="text" id="last-name" name="lastName" required placeholder="e.g., Morgan">
          </div>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required placeholder="alex.morgan@example.com">
          </div>

          <div class="form-group">
            <label for="phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" required placeholder="+1 (555) 019-2834">
          </div>

          <div class="form-group full-width">
            <label for="linkedin">LinkedIn Profile URL</label>
            <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/username">
          </div>

        </div>
      </fieldset>

      <!-- Position & Experience Details -->
      <fieldset>
        <legend>Position Details</legend>
        <div class="form-grid">

          <div class="form-group">
            <label for="position">Position Applying For <span class="required">*</span></label>
            <select id="position" name="position" required>
              <option value="" disabled selected>Select position...</option>
              <option value="frontend-engineer">Frontend Engineer</option>
              <option value="backend-engineer">Backend Engineer</option>
              <option value="fullstack-engineer">Full-Stack Engineer</option>
              <option value="env-engineer">Environmental Engineer</option>
              <option value="ui-ux-designer">UI/UX Designer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience-years">Years of Experience <span class="required">*</span></label>
            <input type="number" id="experience-years" name="experienceYears" min="0" max="40" required placeholder="e.g., 5">
          </div>

          <div class="form-group">
            <label for="earliest-start">Earliest Start Date <span class="required">*</span></label>
            <input type="date" id="earliest-start" name="earliestStart" required>
          </div>

          <div class="form-group">
            <label>Work Preference <span class="required">*</span></label>
            <div class="radio-group">
              <label class="option-label">
                <input type="radio" name="workPreference" value="remote" required> Remote
              </label>
              <label class="option-label">
                <input type="radio" name="workPreference" value="on-site"> On-site
              </label>
              <label class="option-label">
                <input type="radio" name="workPreference" value="hybrid"> Hybrid
              </label>
            </div>
          </div>

        </div>
      </fieldset>

      <!-- Documents & Cover Letter -->
      <fieldset>
        <legend>Documents & Cover Letter</legend>
        <div class="form-grid">

          <div class="form-group full-width">
            <label for="resume">Upload Resume (PDF / DOCX) <span class="required">*</span></label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
          </div>

          <div class="form-group full-width">
            <label for="cover-letter">Cover Letter / Statement of Purpose</label>
            <textarea id="cover-letter" name="coverLetter" rows="5" placeholder="Tell us why you are interested in this role and what unique skills you bring..."></textarea>
          </div>

        </div>
      </fieldset>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="reset">Clear Form</button>
        <button type="submit">Submit Application</button>
      </div>

    </form>
  </div>

</body>
</html>
